name: CI

# Builds and tests everything on every push. Download the ready-to-use files from the run's
# "Artifacts": PocketPC-Windows (PocketPC.exe + installer script) and PocketPC-Android (APK).
# Pushing a tag like v0.1.0 also publishes them as a GitHub Release.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pc:
    name: PC companion (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test pc/tests/PocketPC.Core.Tests --logger "console;verbosity=normal"

      - name: Publish PocketPC.exe
        run: dotnet publish pc/src/PocketPC.Companion -c Release -o out/PocketPC-Windows

      - name: Add installer script
        shell: pwsh
        run: Copy-Item scripts/install-pc.ps1 out/PocketPC-Windows/

      - uses: actions/upload-artifact@v4
        with:
          name: PocketPC-Windows
          path: |
            out/PocketPC-Windows/PocketPC.exe
            out/PocketPC-Windows/install-pc.ps1

  interop:
    name: Phone ↔ PC pairing interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Start headless companion
        run: |
          dotnet build pc/tools/PocketPC.TestHost -c Release
          dotnet pc/tools/PocketPC.TestHost/bin/Release/net10.0/PocketPC.TestHost.dll \
            --port 0 --host 127.0.0.1 --uri-file "$RUNNER_TEMP/pairing-uri.txt" > "$RUNNER_TEMP/testhost.log" 2>&1 &
          for i in $(seq 1 30); do [ -s "$RUNNER_TEMP/pairing-uri.txt" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/testhost.log"

      - name: Java protocol + interop tests
        working-directory: android/pocketpc-core
        env:
          POCKETPC_TESTHOST_URI_FILE: ${{ runner.temp }}/pairing-uri.txt
        run: ../gradlew --no-daemon test

      - name: Companion log
        if: always()
        run: cat "$RUNNER_TEMP/testhost.log"

  android:
    name: Phone app (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The Android Gradle plugin downloads the exact SDK platform and NDK the app asks for
      # (compileSdk / ndkVersion in app/build.gradle) once the licenses are accepted.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleNonRootDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/nonRoot/debug/*.apk PocketPC.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PocketPC-Android
          path: PocketPC.apk

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pc, interop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PocketPC-Windows/PocketPC.exe
            dist/PocketPC-Windows/install-pc.ps1
            dist/PocketPC-Android/PocketPC.apk
