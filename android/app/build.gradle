apply plugin: 'com.android.application'

// PocketPC phone app. Based on Moonlight for Android v12.2 (GPL-3.0); see ../UPSTREAM.md
// for what was changed. New PocketPC code lives in src/main/java/com/pocketpc/app.

android {
    ndkVersion "29.0.14206865"

    compileSdk 37

    namespace 'com.limelight'

    defaultConfig {
        // 24 (Android 7.0) is required by the QR scanner library.
        minSdk 24
        targetSdk 36

        versionName "0.1.0"
        versionCode = 1

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'
    }

    signingConfigs {
        // A shared, committed key so every CI build can be installed over the previous one.
        // It is NOT a secret and must not be used for store releases.
        shared {
            storeFile file('debug-shared.keystore')
            storePassword 'android'
            keyAlias 'pocketpc-debug'
            keyPassword 'android'
        }
    }

    flavorDimensions.add("root")

    buildFeatures {
        buildConfig = true
        resValues = true
    }

    productFlavors {
        root {
            // Android O has native mouse capture, so don't show the rooted
            // version to devices running O on the Play Store.
            maxSdk 25

            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=root"
                }
            }

            applicationId "com.pocketpc.app.root"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "true"
        }

        nonRoot {
            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=nonRoot"
                }
            }

            applicationId "com.pocketpc.app"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    lint {
        disable 'MissingTranslation'
        lintConfig file('lint.xml')
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            signingConfig signingConfigs.shared
            resValue "string", "app_label", "PocketPC (Debug)"
            resValue "string", "app_label_root", "PocketPC (Root Debug)"
        }
        release {
            // Upstream Moonlight asks forks to use their own application ID, which we do
            // (com.pocketpc.app), so no ".unofficial" suffix is needed here.
            signingConfig signingConfigs.shared
            resValue "string", "app_label", "PocketPC"
            resValue "string", "app_label_root", "PocketPC (Root)"

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    packaging {
        resources {
            // BouncyCastle includes duplicate LICENSE.md files
            excludes += '/META-INF/*.md'
        }
    }
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'org.jmdns:jmdns:3.6.3'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'

    // PocketPC: pairing protocol (../pocketpc-core, composite build) and QR scanning (Apache-2.0).
    implementation 'com.pocketpc:pocketpc-core:1.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
